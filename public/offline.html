<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Cargo Stock — sem conexão</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; color: #1f2937; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
    img { width: 96px; height: auto; margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #1e40af; }
    p { font-size: 14px; line-height: 1.5; color: #4b5563; margin: 0 0 16px; }
    a, button { display: inline-block; margin: 4px; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .primary { background: #1e40af; color: #fff; border: 0; }
    .secondary { background: #fff; color: #1e40af; border: 1px solid #c7d2fe; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/cargo-logo.png" alt="Cargo Stock" />
    <h1>Sem conexão</h1>
    <p>Esta tela ainda não foi salva no celular. Os Relatórios de Bordo funcionam offline depois que você abre a tela uma vez com internet.</p>
    <p>Os lançamentos feitos sem sinal ficam guardados no celular e são enviados sozinhos quando a internet voltar.</p>
    <a class="primary" href="/relatorios">Abrir Relatórios de Bordo</a>
    <button class="secondary" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
